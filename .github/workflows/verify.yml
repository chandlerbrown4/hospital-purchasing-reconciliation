name: Verify demo
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the test suite
        run: python3 -m unittest discover -s tests -v
      - name: Reproduce the frozen held-out scorecard
        run: python3 evaluation/score_holdout.py
      - name: Run the documented demo
        run: python3 -m purchasing
      - name: Check the published example against the demo
        run: |
          for csv in examples/outputs/*.csv examples/outputs/before/*.csv; do
            cmp "$csv" "build/${csv#examples/outputs/}"
          done
      - name: Reproduce the published AP registers and control totals
        run: |
          python3 -m purchasing examples/ap-review/batch --mappings evaluation/held-out-v1 --output build/ap-review-day
          python3 -m purchasing evaluation/held-out-v1/batch --mappings evaluation/held-out-v1 --output build/ap-review
          for csv in ap_invoice_rows.csv ap_summary.csv; do
            cmp "examples/ap-review/$csv" "build/ap-review-day/$csv"
            cmp "examples/ap-review/original-batch/$csv" "build/ap-review/$csv"
          done
      - name: Exercise the recovery benchmark
        run: python3 -m examples.recovery_benchmark --orders 200

  surgical-handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: hospital-purchasing-reconciliation
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: chandlerbrown4/surgical-case-outcomes
          path: surgical-case-outcomes
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify the downstream surgical case costs
        working-directory: surgical-case-outcomes
        run: python3 examples/check_purchasing_handoff.py
